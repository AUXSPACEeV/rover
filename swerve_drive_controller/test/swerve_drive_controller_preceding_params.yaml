test_swerve_drive_controller:
  ros__parameters:
    reference_timeout: 0.1

    front_left_wheel_command_joint_name: "front_left_wheel_joint"
    front_right_wheel_command_joint_name: "front_right_wheel_joint"
    rear_left_wheel_command_joint_name: "rear_left_wheel_joint"
    rear_right_wheel_command_joint_name: "rear_right_wheel_joint"
    front_left_steering_command_joint_name: "front_left_steering_joint"
    front_right_steering_command_joint_name: "front_right_steering_joint"
    rear_left_steering_command_joint_name: "rear_left_steering_joint"
    rear_right_steering_command_joint_name: "rear_right_steering_joint"

    front_left_wheel_state_joint_name: "front_left_wheel_state_joint"
    front_right_wheel_state_joint_name: "front_right_wheel_state_joint"
    rear_left_wheel_state_joint_name: "rear_left_wheel_state_joint"
    rear_right_wheel_state_joint_name: "rear_right_wheel_state_joint"
    front_left_steering_state_joint_name: "front_left_steering_state_joint"
    front_right_steering_state_joint_name: "front_right_steering_state_joint"
    rear_left_steering_state_joint_name: "rear_left_steering_state_joint"
    rear_right_steering_state_joint_name: "rear_right_steering_state_joint"

    kinematics:
      wheelbase: 0.4
      track: 0.3
      wheel_radius: 0.05
      steering_angle_optimization: true

    base_frame_id: "base_link"
    odom_frame_id: "odom"
    enable_odom_tf: false
